<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>404 — Route Not Found | Gary Ferdinand Wahyudi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 20%, #111c2d 0%, #0b1220 65%);
        color: #f5f7fa;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .card {
        max-width: 520px;
        width: 100%;
        padding: 36px;
        border-radius: 16px;
        background: rgba(17, 28, 45, 0.85);
        border: 1px solid rgba(154, 169, 188, 0.18);
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #d6b56d;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: #9aa9bc;
        line-height: 1.6;
        font-size: 15px;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      .primary {
        background: #d6b56d;
        color: #0b1220;
      }
      .secondary {
        border: 1px solid rgba(154, 169, 188, 0.25);
        color: #f5f7fa;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">HTTP 404 // ROUTE_NOT_FOUND</div>
      <h1>This endpoint doesn't exist.</h1>
      <p>
        The requested path could not be resolved on Emazer01.github.io. Return to the main portfolio to explore projects, infrastructure capabilities, and GitHub repositories.
      </p>
      <div class="actions">
        <a class="primary" href="/">Return to Portfolio</a>
        <a class="secondary" href="https://github.com/Emazer01" target="_blank" rel="noreferrer">GitHub Profile</a>
      </div>
    </main>
  </body>
</html>
